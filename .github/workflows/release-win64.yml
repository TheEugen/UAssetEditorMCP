name: Release UE 5.4.4 Win64
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64, ue-5.4.4-launcher]
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      checksum: ${{ steps.build.outputs.checksum }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, extract and test the buyer ZIP
        id: build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch' }
          $engine = (Resolve-Path -LiteralPath $env:UE_ENGINE_ROOT).Path
          $python = Join-Path $engine 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $python -B -m unittest discover -s tests -p 'test_*.py'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $python -B tools/package_release.py --engine $engine --output dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $hash = (Get-FileHash 'dist/UAssetEditorMCP-UE5.4.4-Win64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "checksum=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Hand off the validated ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        with:
          name: win64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/UAssetEditorMCP-UE5.4.4-Win64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-ue-5-4-4-win64
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: dist
          merge-multiple: true
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: ${{ needs.build.outputs.checksum }}
        run: python3 tools/publish_release.py dist/UAssetEditorMCP-UE5.4.4-Win64.zip
